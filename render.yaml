# The online play server (server/), for Render: New > Blueprint, pick this
# repo, Apply. See server/README.md.
services:
  - type: web
    name: myths-and-legends-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
